<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mao. — together</title><link rel="stylesheet" href="/style.css"></head><body><header><b>🐱 mao.</b><span>your space, together</span><button id="logout" hidden>Log out</button></header><main><section id="auth"><h1>Meet at your table.</h1><p>Your own Linux desktop, alongside your friends.</p><form id="authform"><input name="username" placeholder="Username" required minlength="3"><input name="passcode" type="password" placeholder="Passcode (8+ characters)" required minlength="8"><button id="authbutton">Create account</button></form><button id="toggle">Already have an account? Log in</button></section><section id="app" hidden><aside><h2 id="welcome"></h2><p id="vmname"></p><h3>Friends</h3><form id="addfriend"><input name="username" placeholder="Friend username"><button>Add</button></form><div id="requests"></div><ul id="friends"></ul><h3>Tables</h3><form id="addroom"><input name="name" placeholder="New table name"><button>Create</button></form><ul id="rooms"></ul></aside><article><div class="top"><div><h2 id="roomtitle">My Webtop</h2><p>Collaborate on your own desktop</p></div><div><button id="voice" disabled>🎙 Join voice</button> <a id="popout" target="_blank" rel="noopener noreferrer">↗ Pop out table</a></div></div><iframe id="webtop" title="My Webtop" allow="fullscreen; clipboard-read; clipboard-write"></iframe><div class="bottom"><section><h3>At the table</h3><div id="participants"></div><div id="invite"></div></section><section><h3>Chat</h3><div id="messages"></div><form id="chat"><input name="body" placeholder="Message"><button>Send</button></form></section></div></article></section><p id="status" role="status"></p></main><script src="/app.js" defer></script></body></html>
