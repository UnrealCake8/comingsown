<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mao. — together</title><link rel="stylesheet" href="/style.css"></head><body><header><b class="brand"><img src="/mao-logo.png" alt="" onerror="this.hidden=true"> mao.</b><span>your space, together</span><button id="logout" hidden>Log out</button></header><main><section id="auth"><h1>Your space starts here.</h1><p>Your own Linux desktop, alongside your friends.</p><form id="authform"><input name="username" placeholder="Username" required minlength="3"><input name="passcode" type="password" placeholder="Passcode (8+ characters)" required minlength="8"><button id="authbutton">Create account</button></form><button id="toggle">Already have an account? Log in</button></section><section id="app" hidden><aside><div class="identity"><span id="welcome"></span><span id="vmname" hidden></span></div><details class="drawer"><summary>Friends</summary><form id="addfriend"><input name="username" placeholder="Friend username"><button>Add</button></form><div id="requests"></div><ul id="friends"></ul></details><h3>Spaces</h3><form id="addroom"><input name="name" placeholder="New space name"><button>Create</button></form><ul id="rooms"></ul></aside><article><div class="top"><div><h2 id="roomtitle">My Webtop</h2><p>Collaborate on your own desktop</p></div><div class="actions"><button id="share" disabled>Share VM Screen</button><button id="viewshare" hidden>View Presenter’s VM</button><button id="backdesktop" hidden>My desktop</button><button id="voice" disabled>🎙 Join voice</button><a id="popout" target="_blank" rel="noopener noreferrer">↗ Open desktop</a></div></div><div id="vmloading" class="vmloading"><img src="https://media.tenor.com/2Q3b80oIodoAAAAj/cat-yarn.gif" alt="Loading animation"><span>Opening your desktop…</span></div><iframe id="webtop" title="My Webtop" allow="fullscreen; clipboard-read; clipboard-write"></iframe><div class="bottom"><section>
